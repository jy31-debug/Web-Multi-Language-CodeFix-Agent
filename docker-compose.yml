version: "3.9"

services:
  codefix-web:
    build: .
    container_name: codefix-agent-web
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    volumes:
      - ./workspaces:/app/workspaces
      - ./memory_store:/app/memory_store
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: codefix-agent-redis
    ports:
      - "6379:6379"